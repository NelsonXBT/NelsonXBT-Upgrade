<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutorials - NelsonXBT</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="tutorials.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header class="header">

        <a href="index.html">
            <div class="logo">
                <span class="white">Nelson</span>
                <span class="gold">XBT</span>
            </div>
        </a>

        <div class="header-right">

            <div class="social-icons">
                <a href="https://x.com/nelson_xbt" target="_blank">
                    <i class="fa-brands fa-x-twitter"></i>
                </a>

                <a href="https://t.me/NelsonXBT" target="_blank">
                    <i class="fa-brands fa-telegram"></i>
                </a>

                <a href="https://www.youtube.com/@NelsonXBT" target="_blank">
                    <i class="fa-brands fa-youtube"></i>
                </a>
            </div>

            <a href="about.html" class="about-btn">
                About Me
            </a>

        </div>

    </header>



    <!-- =========================
         COURSE LAYOUT
    ========================== -->

    <main class="tutorial-layout">

        <!-- =========================
             SIDEBAR
        ========================== -->

        <aside class="tutorial-sidebar">

            <div class="sidebar-header">

                <span class="sidebar-label">
                    LEARNING ROADMAP
                </span>

                <h1>
                    Your Path to Trading Mastery
                </h1>

            </div>


            <div class="course-menu">

                <!-- Active Category -->

                <button
                    class="course-category active"
                    data-category="crypto-basics">

                    <span class="course-number">01</span>

                    <div class="course-info">

                        <h3>Crypto Basics</h3>

                        <p>4 Lessons</p>

                    </div>

                </button>


                <button
                    class="course-category"
                    data-category="spot-trading">

                    <span class="course-number">02</span>

                    <div class="course-info">

                        <h3>Spot Trading</h3>

                        <p>5 Lessons</p>

                    </div>

                </button>


                <button
                    class="course-category"
                    data-category="futures-trading">

                    <span class="course-number">03</span>

                    <div class="course-info">

                        <h3>Futures Trading</h3>

                        <p>6 Lessons</p>

                    </div>

                </button>


                <button
                    class="course-category"
                    data-category="order-types">

                    <span class="course-number">04</span>

                    <div class="course-info">

                        <h3>Order Types</h3>

                        <p>4 Lessons</p>

                    </div>

                </button>


                <button
                    class="course-category"
                    data-category="risk-management">

                    <span class="course-number">05</span>

                    <div class="course-info">

                        <h3>Risk Management</h3>

                        <p>5 Lessons</p>

                    </div>

                </button>


                <button
                    class="course-category"
                    data-category="entries-exits">

                    <span class="course-number">06</span>

                    <div class="course-info">

                        <h3>Entries & Exits</h3>

                        <p>5 Lessons</p>

                    </div>

                </button>

            </div>

        </aside>



        <!-- =========================
             LESSONS AREA
        ========================== -->

        <section class="tutorial-content">

            <div class="content-header">

                <h2>
                    Lessons in this Module
                </h2>

                <div class="line gold"></div>

            </div>


            <!-- JS will replace this entire container -->

            <div id="lesson-container">


                <!-- Lesson Card -->

                <article
                    class="lesson-card"
                    data-video="https://www.youtube.com/embed/VIDEO_ID">

                    <div class="lesson-thumbnail">

                        <img
                            src="assets/tutorials/lesson-1.jpg"
                            alt="Lesson Thumbnail">

                    </div>

                    <div class="lesson-details">

                        <span class="lesson-label">
                            Lesson 1
                        </span>

                        <h3>
                            Why Most Traders Lose
                        </h3>

                        <p class="lesson-duration">
                            <i class="fa-regular fa-clock"></i>
                            15:42
                        </p>

                    </div>

                </article>



                <article
                    class="lesson-card"
                    data-video="https://www.youtube.com/embed/VIDEO_ID">

                    <div class="lesson-thumbnail">

                        <img
                            src="assets/tutorials/lesson-2.jpg"
                            alt="Lesson Thumbnail">

                    </div>

                    <div class="lesson-details">

                        <span class="lesson-label">
                            Lesson 2
                        </span>

                        <h3>
                            Position Sizing
                        </h3>

                        <p class="lesson-duration">
                            <i class="fa-regular fa-clock"></i>
                            16:35
                        </p>

                    </div>

                </article>


            </div>

        </section>

    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <p>
            © 2026 NelsonXBT. All rights reserved.
        </p>

    </footer>


    <!-- JS -->

    <script src="tutorials.js"></script>

</body>
</html>
